[project]
name = "sports-analyzer"
version = "0.1.0"
description = "Detect sponsor logos in sports footage and measure their on-screen exposure."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "clip",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "ultralytics>=8.3",
]

[project.scripts]
sports-analyzer = "sports_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sports_analyzer"]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git" }
