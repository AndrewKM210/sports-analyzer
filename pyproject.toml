[project]
name = "sports-analyzer"
version = "0.1.0"
description = "Detect sponsor logos in sports footage and measure their on-screen exposure."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "clip @ git+https://github.com/ultralytics/CLIP.git",
    "opencv-python>=5.0.0.93",
    "pyyaml>=6.0.3",
    "ultralytics>=8.3",
]

[project.scripts]
sports-analyzer = "sports_analyzer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sports_analyzer"]

[tool.hatch.metadata]
allow-direct-references = true  # CLIP is only published on GitHub
